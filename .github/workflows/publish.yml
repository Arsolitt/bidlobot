name: publish

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # Provenance anchor: the upstream revision the fork tree is based on.
  # Bump it together with every upstream rebase - the published tag
  # embeds its short form. This workflow builds the pushed fork commit
  # (plain actions/checkout), NOT this upstream revision.
  UPSTREAM_REPOSITORY: BYDLOKOD/bidlobot
  UPSTREAM_SHA: ed97cc32ea6e9d20276c7883a9db4ae86a5d168d
  IMAGE: ghcr.io/arsolitt/bidlobot

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        run: |
          tag="master-${UPSTREAM_SHA:0:7}-f${GITHUB_SHA:0:7}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Publishing $IMAGE:$tag"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
