name: publish

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPOSITORY: BYDLOKOD/bidlobot
  UPSTREAM_SHA: ed97cc32ea6e9d20276c7883a9db4ae86a5d168d
  IMAGE: ghcr.io/arsolitt/bidlobot:master-ed97cc32

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=master-ed97cc32
            COMMIT=${{ env.UPSTREAM_SHA }}
          tags: ${{ env.IMAGE }}
