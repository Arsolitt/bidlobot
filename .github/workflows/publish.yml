name: publish

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # Provenance anchor: the upstream revision the fork tree is based on.
  # Bump it together with every upstream rebase - the published tag
  # embeds its short form. This workflow builds the pushed fork commit
  # (plain actions/checkout), NOT this upstream revision.
  UPSTREAM_REPOSITORY: BYDLOKOD/bidlobot
  UPSTREAM_SHA: ed97cc32ea6e9d20276c7883a9db4ae86a5d168d
  IMAGE: ghcr.io/arsolitt/bidlobot

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.tag.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          tag="master-${UPSTREAM_SHA:0:7}-f${GITHUB_SHA:0:7}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$tag"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

  # Deploys are tag bumps: rewrite newTag on the gitops branch and let
  # Flux roll the cluster. GITHUB_TOKEN pushes never trigger workflows,
  # so this cannot loop back into publish.
  update-manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitops

      - name: Bump newTag in deploy/kustomization.yaml
        env:
          TAG: ${{ needs.image.outputs.TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s|newTag: .*|newTag: $TAG|" deploy/kustomization.yaml
          if git diff --quiet -- deploy/kustomization.yaml; then
            echo "newTag already $TAG; nothing to push"
            exit 0
          fi
          git add deploy/kustomization.yaml
          git commit -m "chore(deploy): bump image tag to $TAG"
          git push
